<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบัญชีกองกลางทริป (Google Sheet Database)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Kanit', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="h-full pb-20 selection:bg-indigo-500 selection:text-white">
  
  <header class="sticky top-0 z-40 glass-card border-b border-slate-800/80 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center text-white shadow-lg">
          <i class="fa-solid fa-file-excel text-base"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-white leading-tight">Trip Expense Pool</h1>
          <div class="flex items-center space-x-1">
            <span id="syncStatusBadge" class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="w-1.5 h-1.5 mr-1 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="syncStatusText">Google Sheet Connected</span>
            </span>
            <span id="roomBadge" class="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded-full font-mono border border-slate-700"></span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-1.5">
        <button onclick="openShareModal()" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-xl border border-slate-700">
          <i class="fa-solid fa-share-nodes text-sm"></i>
        </button>
        <button onclick="openSyncModal()" class="p-2 text-indigo-400 bg-indigo-500/10 rounded-xl border border-indigo-500/30">
          <i class="fa-solid fa-wifi text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <div class="glass-card rounded-2xl p-4 shadow-xl border border-emerald-500/20">
      <div class="text-xs text-slate-400 mb-1 flex justify-between items-center">
        <span>เงินกองกลางคงเหลือ</span>
        <span class="text-[10px] text-slate-500">Auto Sync ทุก 3 วิ</span>
      </div>
      <div class="flex items-baseline space-x-1 mb-3">
        <span class="text-3xl font-extrabold text-white" id="dispPoolBalance">0.00</span>
        <span class="text-slate-400 text-sm">บาท</span>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-700/50 text-xs">
        <div class="bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/30">
          <div class="text-slate-400 text-[11px]">เติมเข้ากองกลางรวม</div>
          <div class="font-semibold text-emerald-400 text-sm" id="dispTotalPoolIn">฿0.00</div>
        </div>
        <div class="bg-slate-800/50 p-2.5 rounded-xl border border-slate-700/30">
          <div class="text-slate-400 text-[11px]">ใช้ออกสากองกลาง</div>
          <div class="font-semibold text-rose-400 text-sm" id="dispTotalPoolOut">฿0.00</div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <button onclick="openDepositModal()" class="flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 px-3 rounded-xl font-medium text-sm">
        <i class="fa-solid fa-plus-circle"></i><span>เติมเงินกองกลาง</span>
      </button>
      <button onclick="openExpenseModal()" class="flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-3 rounded-xl font-medium text-sm">
        <i class="fa-solid fa-receipt"></i><span>ลงรายการจ่าย</span>
      </button>
    </div>

    <div class="glass-card rounded-2xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-slate-200">สมาชิกทริป (<span id="memberCount">0</span> คน)</h2>
        <button onclick="openAddMemberModal()" class="text-xs text-indigo-400 font-medium">+ เพิ่มสมาชิก</button>
      </div>
      <div id="membersList" class="flex flex-wrap gap-2"></div>
    </div>

    <div class="glass-card rounded-2xl p-4">
      <h2 class="text-sm font-semibold text-slate-200 mb-3">ประวัติรายการทั้งหมด</h2>
      <div id="txList" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
    </div>

    <div class="glass-card rounded-2xl p-4 border border-purple-500/20">
      <h2 class="text-sm font-semibold text-slate-200">สรุปยอดเคลียร์เงินทริป</h2>
      <div id="settlementResults" class="space-y-2 mt-3 pt-3 border-t border-slate-800"></div>
    </div>
  </main>

  <!-- Modals -->
  <div id="syncModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 border border-slate-700">
      <h3 class="font-bold text-white mb-3">สลับรหัสห้องทริป</h3>
      <input type="text" id="inputRoomCode" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white mb-3 uppercase">
      <button onclick="switchRoom()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm">เข้าสู่ห้องนี้</button>
    </div>
  </div>

  <div id="depositModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 border border-slate-700">
      <h3 class="font-bold text-white mb-3">เติมเงินเข้ากองกลาง</h3>
      <form onsubmit="handleDeposit(event)" class="space-y-3">
        <select id="depositPayer" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"></select>
        <input type="number" step="0.01" min="1" id="depositAmount" placeholder="จำนวนเงิน" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
        <input type="text" id="depositNote" placeholder="บันทึกเพิ่มเติม" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-xl text-sm">ตกลง</button>
      </form>
    </div>
  </div>

  <div id="expenseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 border border-slate-700">
      <h3 class="font-bold text-white mb-3">บันทึกค่าใช้จ่าย</h3>
      <form onsubmit="handleExpense(event)" class="space-y-3">
        <input type="text" id="expenseTitle" placeholder="ชื่อรายการ" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
        <input type="number" step="0.01" min="1" id="expenseAmount" placeholder="จำนวนเงิน" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
        <select id="expensePayerType" onchange="togglePayerMemberSelect()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          <option value="POOL">ใช้เงินกองกลางจ่าย</option>
          <option value="MEMBER">สมาชิกสำรองจ่ายส่วนตัว</option>
        </select>
        <div id="payerMemberGroup" class="hidden">
          <select id="expensePayerMember" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"></select>
        </div>
        <select id="expenseCategory" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          <option value="อาหาร">🍔 อาหาร/เครื่องดื่ม</option>
          <option value="เดินทาง">🚗 ค่าน้ำมัน/เดินทาง</option>
          <option value="ที่พัก">🏨 ค่าที่พัก</option>
          <option value="อื่นๆ">📦 อื่นๆ</option>
        </select>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm">บันทึก</button>
      </form>
    </div>
  </div>

  <div id="shareModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 text-center">
      <h3 class="font-bold text-white mb-2">แชร์ทริปให้เพื่อน</h3>
      <div id="qrcode" class="bg-white p-2 inline-block rounded-xl my-2"></div>
      <button onclick="copyShareLink()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs mt-2">คัดลอกลิงก์</button>
    </div>
  </div>

  <script>
    // ⬇️ วาง Web App URL ที่ก๊อปปี้มาจาก Google Apps Script ตรงนี้ ⬇️
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyHIJn5WJsz-jpY2KX9JwRWEuDWjqEi14wKMXkr597aOa46bZQQZoSSEbo-FkkVXrx-dA/exec";

    let state = {
      roomCode: "TRIP123",
      members: ["A", "B", "C"],
      transactions: []
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomFromUrl = urlParams.get('room');
      if (roomFromUrl) state.roomCode = roomFromUrl.toUpperCase();
      
      document.getElementById('inputRoomCode').value = state.roomCode;
      fetchSheetData();
      setInterval(fetchSheetData, 3000); // Auto pull updates
    });

    async function fetchSheetData() {
      try {
        const res = await fetch(`${GOOGLE_SHEET_API_URL}?room=${state.roomCode}`);
        if (res.ok) {
          const data = await res.json();
          state.members = data.members || ["A", "B", "C"];
          state.transactions = data.transactions || [];
          renderApp();
        }
      } catch (err) {}
    }

    async function pushSheetData() {
      renderApp();
      try {
        await fetch(GOOGLE_SHEET_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
      } catch (err) {}
    }

    function renderApp() {
      document.getElementById('roomBadge').innerText = `#${state.roomCode}`;
      let totalDeposit = 0, totalPoolSpent = 0;

      (state.transactions || []).forEach(tx => {
        if (tx.type === 'DEPOSIT') totalDeposit += Number(tx.amount);
        else if (tx.type === 'EXPENSE' && tx.payerType === 'POOL') totalPoolSpent += Number(tx.amount);
      });

      document.getElementById('dispPoolBalance').innerText = (totalDeposit - totalPoolSpent).toLocaleString('th-TH', { minimumFractionDigits: 2 });
      document.getElementById('dispTotalPoolIn').innerText = `฿${totalDeposit.toLocaleString('th-TH')}`;
      document.getElementById('dispTotalPoolOut').innerText = `฿${totalPoolSpent.toLocaleString('th-TH')}`;
      document.getElementById('memberCount').innerText = state.members.length;

      document.getElementById('membersList').innerHTML = state.members.map(m => `
        <span class="bg-slate-800 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-xl text-xs">${m}</span>
      `).join('');

      const memberOpts = state.members.map(m => `<option value="${m}">${m}</option>`).join('');
      document.getElementById('depositPayer').innerHTML = memberOpts;
      document.getElementById('expensePayerMember').innerHTML = memberOpts;

      const txContainer = document.getElementById('txList');
      if ((state.transactions || []).length === 0) {
        txContainer.innerHTML = `<div class="text-center py-4 text-slate-500 text-xs">ยังไม่มีรายการ</div>`;
      } else {
        txContainer.innerHTML = state.transactions.slice().reverse().map(tx => `
          <div class="flex justify-between p-2 rounded-xl bg-slate-800/40 text-xs border border-slate-800">
            <div>
              <div class="font-medium text-slate-200">${tx.title}</div>
              <div class="text-[10px] text-slate-400">${tx.type === 'DEPOSIT' ? `เติมโดย: ${tx.payer}` : `${tx.category} •${tx.payer}`}</div>
            </div>
            <div class="font-bold ${tx.type === 'DEPOSIT' ? 'text-emerald-400' : 'text-slate-200'}">
              ${tx.type === 'DEPOSIT' ? '+' : ''}${Number(tx.amount).toLocaleString('th-TH')} ฿
            </div>
          </div>
        `).join('');
      }

      calculateSettlement();
    }

    function calculateSettlement() {
      const num = state.members.length;
      if (num === 0) return;

      let totalPersonal = 0, totalPoolSpent = 0, totalPoolDeposits = 0;
      let memberDeposits = {}, memberOutPockets = {};
      state.members.forEach(m => { memberDeposits[m] = 0; memberOutPockets[m] = 0; });

      (state.transactions || []).forEach(tx => {
        const amt = Number(tx.amount);
        if (tx.type === 'DEPOSIT') {
          totalPoolDeposits += amt;
          if (memberDeposits[tx.payer] !== undefined) memberDeposits[tx.payer] += amt;
        } else if (tx.type === 'EXPENSE') {
          if (tx.payerType === 'POOL') totalPoolSpent += amt;
          else {
            totalPersonal += amt;
            if (memberOutPockets[tx.payer] !== undefined) memberOutPockets[tx.payer] += amt;
          }
        }
      });

      const grandTotal = totalPoolSpent + totalPersonal;
      const perPerson = grandTotal / num;

      let html = `<div class="text-xs space-y-1 mb-2 text-slate-300">
        <div>รวมทั้งทริป: <b>฿${grandTotal.toLocaleString('th-TH')}</b> | เฉลี่ยคนละ: <b>฿${perPerson.toLocaleString('th-TH')}</b></div>
      </div>`;

      state.members.forEach(m => {
        const net = (memberDeposits[m] + memberOutPockets[m]) - perPerson;
        const txt = net >= 0 ? `ได้คืน ฿${Math.abs(net).toLocaleString('th-TH')}` : `จ่ายเพิ่ม ฿${Math.abs(net).toLocaleString('th-TH')}`;
        html += `<div class="flex justify-between p-2 rounded-xl text-xs border ${net >= 0 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'} mb-1">
          <span>${m}</span><b>${txt}</b>
        </div>`;
      });
      document.getElementById('settlementResults').innerHTML = html;
    }

    function handleDeposit(e) {
      e.preventDefault();
      state.transactions.push({
        id: 'tx_' + Date.now(), type: 'DEPOSIT', payer: document.getElementById('depositPayer').value,
        amount: parseFloat(document.getElementById('depositAmount').value), title: document.getElementById('depositNote').value || 'เติมเงินกองกลาง'
      });
      pushSheetData();
      closeModal('depositModal');
    }

    function handleExpense(e) {
      e.preventDefault();
      const payerType = document.getElementById('expensePayerType').value;
      state.transactions.push({
        id: 'tx_' + Date.now(), type: 'EXPENSE', title: document.getElementById('expenseTitle').value,
        amount: parseFloat(document.getElementById('expenseAmount').value), payerType: payerType,
        payer: payerType === 'MEMBER' ? document.getElementById('expensePayerMember').value : 'กองกลาง',
        category: document.getElementById('expenseCategory').value
      });
      pushSheetData();
      closeModal('expenseModal');
    }

    async function openAddMemberModal() {
      const { value: name } = await Swal.fire({ title: 'เพิ่มสมาชิก', input: 'text', background: '#1e293b', color: '#fff' });
      if (name && !state.members.includes(name.trim())) {
        state.members.push(name.trim());
        pushSheetData();
      }
    }

    function switchRoom() {
      state.roomCode = document.getElementById('inputRoomCode').value.trim().toUpperCase();
      fetchSheetData();
      closeModal('syncModal');
    }

    function togglePayerMemberSelect() {
      document.getElementById('payerMemberGroup').classList.toggle('hidden', document.getElementById('expensePayerType').value !== 'MEMBER');
    }

    function openShareModal() {
      const url = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), { text: url, width: 120, height: 120 });
      openModal('shareModal');
    }

    function copyShareLink() {
      navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?room=${state.roomCode}`);
      Swal.fire({ icon: 'success', title: 'คัดลอกลิงก์แล้ว', timer: 1000, showConfirmButton: false, background: '#1e293b', color: '#fff' });
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openSyncModal() { openModal('syncModal'); }
    function openDepositModal() { openModal('depositModal'); }
    function openExpenseModal() { openModal('expenseModal'); }
  </script>
</body>
</html>
